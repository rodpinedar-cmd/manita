<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración — Manita</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563EB">
<link rel="stylesheet" href="css/styles.css?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.adm-wrap { max-width: 820px; margin: 32px auto; padding: 0 20px; }
.adm-tabs { display: flex; gap: var(--sp-2); border-bottom: 1px solid var(--border); margin-bottom: var(--sp-5); }
.adm-tab { flex: 1; background: none; border: none; border-bottom: 2px solid transparent; padding: var(--sp-3); font-family: inherit; font-size: var(--fs-sm); font-weight: 600; color: var(--gray); cursor: pointer; min-height: 44px; }
.adm-tab.active { color: var(--primary-text); border-bottom-color: var(--primary); }
.vr-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow-xs); }
.vr-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.vr-title { font-size: 16px; font-weight: 700; color: var(--navy); }
.vr-meta { font-size: 13px; color: var(--gray); margin-top: 2px; }
.vr-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.vr-actions .btn { min-height: 44px; }
.vr-status { font-size: 12px; padding: 4px 12px; border-radius: 12px; font-weight: 600; }
.st-pending { background: #FFF3E0; color: var(--warning-text); }
.st-approved { background: #E6F7F1; color: var(--success-text); }
.st-rejected { background: #FDECEC; color: var(--danger); }
</style>
</head>
<body>
<header class="header" id="appHeader"></header>

<div class="adm-wrap">
  <h1 style="font-size:var(--fs-xl);margin-bottom:4px;">Panel de administración</h1>
  <p style="color:var(--gray);font-size:var(--fs-sm);margin-bottom:var(--sp-5);">Verificaciones de identidad de profesionales</p>

  <div id="admGate"><div class="skeleton skeleton-line"></div></div>

  <div id="admContent" style="display:none;">
    <div class="adm-tabs" role="tablist">
      <button type="button" class="adm-tab active" data-f="pending" role="tab" aria-selected="true">Pendientes</button>
      <button type="button" class="adm-tab" data-f="approved" role="tab" aria-selected="false">Aprobadas</button>
      <button type="button" class="adm-tab" data-f="rejected" role="tab" aria-selected="false">Rechazadas</button>
    </div>
    <div id="vrList"><div class="skeleton skeleton-card"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/components.js"></script>
<script src="js/admin.js"></script>
</body>
</html>

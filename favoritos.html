<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favoritos — Manita</title>
<meta name="description" content="Tus profesionales favoritos en Manita.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF6B4A">
<link rel="stylesheet" href="css/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header class="header" id="appHeader"></header>
<div style="max-width:720px;margin:24px auto;padding:0 20px;">
  <h1 style="font-size:24px;margin-bottom:16px;">Favoritos</h1>
  <div id="favList"><div class="skeleton skeleton-card"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/components.js"></script>
<script>
mountHeader({ search: false }); mountBottomNav('favoritos');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function render(){
  var list = document.getElementById('favList');
  var map = favGetAll();
  var items = Object.keys(map).map(function(k){ return map[k]; });
  if (!items.length){
    list.innerHTML = emptyState({ icon:'🤍', title:'Aún no tienes favoritos', text:'Toca el corazón en cualquier profesional para guardarlo aquí y encontrarlo rápido.', ctaText:'Explorar servicios', ctaHref:'categorias.html' });
    return;
  }
  list.innerHTML = items.map(function(p){
    return '<div class="fav-card">' +
      '<a class="fav-main" href="perfil.html?id=' + esc(p.id) + '">' +
        '<div class="fav-info"><strong>' + esc(p.service_name || 'Profesional') + (p.verified?' ✔️':'') + '</strong>' +
        '<span>📍 ' + esc(p.zone || 'CDMX') + (p.price?(' · $' + esc(p.price) + ' / ' + esc(p.price_unit||'servicio')):'') + '</span></div>' +
      '</a>' +
      '<button type="button" class="fav-remove" data-rm="' + esc(p.id) + '" aria-label="Quitar de favoritos">❤️</button>' +
    '</div>';
  }).join('');
  list.querySelectorAll('[data-rm]').forEach(function(btn){
    btn.onclick = function(){ toggleFavorito(btn.getAttribute('data-rm')); render(); };
  });
}
render();
</script>
</body>
</html>

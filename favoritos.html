<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favoritos — Manita</title>
<meta name="description" content="Tus profesionales favoritos en Manita.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF6B4A">
<link rel="stylesheet" href="css/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header class="header" id="appHeader"></header>
<div style="max-width:720px;margin:24px auto;padding:0 20px;">
  <h1 style="font-size:24px;margin-bottom:16px;">Favoritos</h1>
  <div id="favList"><div class="skeleton skeleton-card"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/components.js"></script>
<script>
mountHeader({ search: false }); mountBottomNav('favoritos');
(async function(){
  var list = document.getElementById('favList');
  var user = await usuarioActual();
  if (!user) { list.innerHTML = emptyState({ icon:'🔒', title:'Inicia sesión', text:'Entra para guardar tus profesionales favoritos.', ctaText:'Entrar', ctaHref:'login.html?next=favoritos.html' }); return; }
  // Favoritos aún no implementados como tabla: estado vacío honesto
  list.innerHTML = emptyState({ icon:'🤍', title:'Aún no tienes favoritos', text:'Guarda profesionales que te gusten con el corazón desde su perfil.', ctaText:'Explorar servicios', ctaHref:'categorias.html' });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categorías de servicios a domicilio — Manita</title>
<meta name="description" content="Limpieza, hogar, belleza, clases, mascotas y cuidados a domicilio en CDMX. Encuentra el servicio que necesitas.">
<link rel="canonical" href="https://manita.pages.dev/categorias.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Manita">
<meta property="og:title" content="Categorías de servicios a domicilio — Manita">
<meta property="og:description" content="Limpieza, hogar, belleza, clases y más en CDMX.">
<meta property="og:url" content="https://manita.pages.dev/categorias.html">
<meta property="og:image" content="https://manita.pages.dev/icons/icon-512.png">
<meta property="og:locale" content="es_MX">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563EB">
<link rel="stylesheet" href="css/styles.css?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="header" id="appHeader"></header>

<section class="section">
  <div class="container">
    <h2 class="section-title">Todas las categorías</h2>
    <p class="section-sub">Encuentra el servicio a domicilio que necesitas en CDMX</p>
    <div class="categories-grid" id="categoriesGrid"></div>
  </div>
</section>

<footer class="footer" id="appFooter"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/components.js"></script>
<script src="js/data.js"></script>
<script>
mountHeader(); mountFooter(); mountBottomNav('buscar');

// Render inicial (sin contador todavía)
function pintarCategorias(conteo){
  document.getElementById('categoriesGrid').innerHTML = CATEGORIES.map(function(c) {
    var n = conteo && conteo[c.id];
    var meta = (n > 0)
      ? '<span class="cat-count">' + n + ' profesional' + (n !== 1 ? 'es' : '') + '</span>'
      : '<span class="cat-count cat-count-soon">Próximamente</span>';
    return '<a href="servicios.html?cat=' + c.id + '" class="category-card">' +
      '<div class="category-icon">' + c.icon + '</div>' +
      '<h3>' + c.name + '</h3><p>' + c.desc + '</p>' + meta + '</a>';
  }).join('');
}
pintarCategorias(null);

// Cargar el contador real de profesionales por categoría (estilo Preply)
if (typeof contarPorCategoria === 'function') {
  contarPorCategoria().then(function(conteo){ pintarCategorias(conteo); }).catch(function(){});
}
</script>
</body>
</html>

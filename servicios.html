<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servicios a domicilio en CDMX — Manita</title>
<meta name="description" content="Explora y reserva profesionales verificados de limpieza, hogar, belleza, clases y más en Ciudad de México.">
<link rel="canonical" href="https://manita-cdmx.netlify.app/servicios.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Manita">
<meta property="og:title" content="Servicios a domicilio en CDMX — Manita">
<meta property="og:description" content="Explora y reserva profesionales verificados en Ciudad de México.">
<meta property="og:url" content="https://manita-cdmx.netlify.app/servicios.html">
<meta property="og:image" content="https://manita-cdmx.netlify.app/icons/icon-512.png">
<meta property="og:locale" content="es_MX">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF6B4A">
<link rel="stylesheet" href="css/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.results-layout { display: grid; grid-template-columns: 260px 1fr; gap: var(--sp-8); padding: var(--sp-6) 0; }
.filters { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-5); height: fit-content; position: sticky; top: 90px; }
.filters h3 { font-size: var(--fs-base); margin-bottom: var(--sp-4); }
.filter-group { margin-bottom: var(--sp-5); }
.filter-group label { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) 0; font-size: var(--fs-sm); color: var(--gray); cursor: pointer; min-height: 44px; }
.filter-group input { accent-color: var(--primary); width: 22px; height: 22px; }
.results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--sp-5); flex-wrap: wrap; gap: var(--sp-3); }
.results-header h1 { font-size: var(--fs-xl); letter-spacing: -0.3px; }
.results-count { color: var(--gray); font-size: var(--fs-sm); }

/* Chips de filtro (visibles en móvil) */
.filter-chips { display: none; gap: var(--sp-2); overflow-x: auto; padding: var(--sp-3) var(--sp-4) var(--sp-2); -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.filter-chips::-webkit-scrollbar { display: none; }
.fchip { flex-shrink: 0; display: inline-flex; align-items: center; min-height: 44px; padding: var(--sp-2) var(--sp-4); border-radius: var(--radius-pill); border: 1px solid var(--border); background: #fff; font-size: var(--fs-sm); font-weight: 600; color: var(--navy); cursor: pointer; white-space: nowrap; transition: all var(--dur) var(--ease); }
.fchip.active { background: var(--primary-text); color: #fff; border-color: var(--primary-text); }

.pros-list { display: flex; flex-direction: column; gap: var(--sp-3); }
.pro-card {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-4);
  box-shadow: var(--shadow-xs); transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  cursor: pointer; display: flex; gap: var(--sp-4); text-decoration: none; color: inherit; align-items: flex-start;
}
.pro-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.pro-card:active { transform: scale(0.99); }
.pro-avatar { font-size: 28px; font-weight: 800; color: var(--primary-text); background: var(--mint); border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
.pro-main { flex: 1; min-width: 0; }
.pro-name { font-size: var(--fs-md); font-weight: 700; display: flex; align-items: center; gap: var(--sp-1); color: var(--navy); }
.verified { color: var(--success); font-size: var(--fs-sm); }
.pro-rating { font-size: var(--fs-sm); font-weight: 600; margin: 3px 0; color: var(--warning-text); }
.pro-rating span { color: var(--gray); font-weight: 400; }
.pro-badges { display: flex; gap: var(--sp-2); margin: var(--sp-2) 0 0; flex-wrap: wrap; }
.pro-badge { font-size: var(--fs-xs); padding: 3px var(--sp-2); border-radius: var(--radius-sm); font-weight: 600; display: flex; align-items: center; gap: 4px; }
.badge-agenda { background: rgba(22,169,127,0.12); color: var(--success-text); }
.pro-bio { font-size: var(--fs-sm); color: var(--gray); margin-top: var(--sp-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pro-right { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: var(--sp-1); }
.pro-price { font-size: var(--fs-lg); font-weight: 800; color: var(--primary-text); line-height: 1; }
.pro-price small { font-size: var(--fs-xs); color: var(--gray); font-weight: 500; display: block; margin-top: 2px; }
.pro-cta { font-size: var(--fs-xs); font-weight: 700; color: var(--navy); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px var(--sp-3); }
.empty { text-align: center; padding: var(--sp-12) var(--sp-5); color: var(--gray); }

@media (max-width: 900px) {
  .results-layout { grid-template-columns: 1fr; gap: 0; padding: 0; }
  .filters { display: none; }        /* sidebar oculto en móvil */
  .filter-chips { display: flex; }    /* chips en su lugar */
  .results-header { padding: var(--sp-4) var(--sp-4) 0; margin-bottom: var(--sp-3); }
  .pros-list { padding: 0 var(--sp-4) var(--sp-6); }
}
</style>
</head>
<body>

<header class="header" id="appHeader">
  <div class="cat-bar"><div class="container cat-bar-inner" id="catBar"></div></div>
</header>

<!-- Chips de filtro (móvil) -->
<div class="filter-chips" id="filterChips"></div>

<div class="container">
  <div class="results-layout">
    <aside class="filters">
      <h3>Categoría</h3>
      <div class="filter-group" id="catFilters"></div>
      <h3>Disponibilidad</h3>
      <div class="filter-group">
        <label><input type="checkbox" id="availToday" aria-label="Disponible hoy"> Disponible hoy</label>
        <label><input type="checkbox" id="verifiedOnly" aria-label="Solo profesionales verificados"> Solo verificados</label>
      </div>
    </aside>
    <main>
      <div class="results-header">
        <div>
          <h1 id="resultsTitle">Profesionales</h1>
          <div class="results-count" id="resultsCount"></div>
        </div>
      </div>
      <div class="pros-list" id="prosList"></div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/components.js"></script>
<script src="js/data.js"></script>
<script src="js/servicios.js"></script>
<script>
mountHeader(); mountBottomNav('buscar');
</script>
</body>
</html>

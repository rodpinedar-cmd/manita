<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del profesional — Manita</title>
<meta name="description" content="Gestiona tus reservas en Manita.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF6B4A">
<link rel="stylesheet" href="css/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.pp-wrap { max-width: 860px; margin: 24px auto; padding: 0 20px; }
/* Resumen de reservas del pro */
.pp-summary { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--sp-3); margin-bottom:var(--sp-5); }
.pp-stat { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:var(--sp-4); text-align:center; box-shadow:var(--shadow-xs); }
.pp-stat b { display:block; font-size:var(--fs-2xl); color:var(--navy); line-height:1; }
.pp-stat span { font-size:var(--fs-xs); color:var(--gray); font-weight:600; }
.pp-stat.hot b { color:var(--primary-text); }
/* Filtro por estado */
.pp-filters { display:flex; gap:var(--sp-2); overflow-x:auto; padding-bottom:var(--sp-2); margin-bottom:var(--sp-4); scrollbar-width:none; }
.pp-filters::-webkit-scrollbar{ display:none; }
.pp-fbtn { flex-shrink:0; min-height:44px; display:inline-flex; align-items:center; padding:var(--sp-2) var(--sp-4); border-radius:var(--radius-pill); border:1px solid var(--border); background:#fff; font-size:var(--fs-sm); font-weight:600; color:var(--navy); cursor:pointer; white-space:nowrap; }
.pp-fbtn.active { background:var(--primary-text); color:#fff; border-color:var(--primary-text); }
.pp-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:var(--sp-4); margin-bottom:var(--sp-3); box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center; gap:var(--sp-3); flex-wrap:wrap; }
.pp-info h3 { font-size:var(--fs-md); color:var(--navy); }
.pp-info p { font-size:var(--fs-sm); color:var(--gray); margin-top:4px; }
.pp-actions { display:flex; gap:var(--sp-2); align-items:center; flex-wrap:wrap; }
.pp-actions .btn { min-height:44px; }
.pp-status { font-size:var(--fs-xs); padding:4px 12px; border-radius:var(--radius-pill); font-weight:700; }
.st-pending { background:#FFF3E0; color:var(--warning-text); }
.st-confirmed { background:#E6F7F1; color:var(--success-text); }
.st-cancelled { background:#FDECEC; color:var(--danger); }
/* Disponibilidad */
.avail-box { background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-xs); overflow:hidden; }
.avail-box summary { padding:var(--sp-4); font-weight:700; color:var(--navy); cursor:pointer; min-height:44px; display:flex; align-items:center; gap:var(--sp-2); }
.avail-body { padding:0 var(--sp-4) var(--sp-4); }
.avail-day { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-2) 0; flex-wrap:wrap; min-height:44px; }
.avail-day label.dchk { display:flex; align-items:center; gap:var(--sp-2); min-width:120px; font-size:var(--fs-sm); font-weight:600; color:var(--navy); cursor:pointer; }
.avail-day input[type=checkbox] { width:22px; height:22px; accent-color:var(--primary); }
.avail-day select { min-height:44px; padding:var(--sp-2) var(--sp-3); border:1px solid var(--border); border-radius:var(--radius-sm); font-family:inherit; }
.avail-day .to { color:var(--gray); font-size:var(--fs-sm); }
</style>
</head>
<body>
<header class="header" id="appHeader"></header>

<div class="pp-wrap">
  <h1 style="font-size:var(--fs-xl);margin-bottom:4px;">Panel del profesional</h1>
  <p style="color:var(--gray);margin-bottom:var(--sp-5);font-size:var(--fs-sm);">Gestiona las reservas que recibes</p>
  <div class="pp-summary" id="ppSummary" style="display:none;">
    <div class="pp-stat hot"><b id="stPending">0</b><span>Pendientes</span></div>
    <div class="pp-stat"><b id="stConfirmed">0</b><span>Confirmadas</span></div>
    <div class="pp-stat"><b id="stDone">0</b><span>Completadas</span></div>
  </div>
  <!-- Editar disponibilidad (horario del profesional) -->
  <div id="availSection" style="display:none;margin-bottom:var(--sp-5);">
    <details class="avail-box">
      <summary>🗓️ Mi disponibilidad <span id="availSummary" style="color:var(--gray);font-weight:400;font-size:var(--fs-sm);"></span></summary>
      <div class="avail-body">
        <p style="color:var(--gray);font-size:var(--fs-sm);margin-bottom:var(--sp-3);">Marca los días y el horario en que atiendes. Los clientes solo podrán reservarte en esas horas.</p>
        <div id="availDays"></div>
        <button type="button" class="btn btn-primary" id="availSave" style="margin-top:var(--sp-3);min-height:44px;">Guardar disponibilidad</button>
      </div>
    </details>
  </div>
  <div class="pp-filters" id="ppFilters" style="display:none;" role="tablist">
    <button type="button" class="pp-fbtn active" data-f="all" role="tab" aria-selected="true">Todas</button>
    <button type="button" class="pp-fbtn" data-f="pending" role="tab" aria-selected="false">Pendientes</button>
    <button type="button" class="pp-fbtn" data-f="confirmed" role="tab" aria-selected="false">Confirmadas</button>
    <button type="button" class="pp-fbtn" data-f="in_progress" role="tab" aria-selected="false">En progreso</button>
    <button type="button" class="pp-fbtn" data-f="done" role="tab" aria-selected="false">Historial</button>
  </div>
  <div id="ppList"><div class="skeleton skeleton-card"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/components.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg,kind){var t=document.createElement('div');t.className='toast toast-'+(kind||'info');t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('show');});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},300);},3200);}

var STATUS_MAP = {
  pending:['st-pending','Pendiente'], confirmed:['st-confirmed','Confirmada'],
  in_progress:['st-pending','En progreso'], completed:['st-confirmed','Completada'],
  reviewed:['st-confirmed','Reseñada'],
  cancelled_by_client:['st-cancelled','Cancelada por el cliente'],
  cancelled_by_professional:['st-cancelled','Rechazada'],
  no_show_client:['st-cancelled','Cliente no asistió'],
  no_show_professional:['st-cancelled','No asististe'],
  disputed:['st-pending','En disputa']
};
// Siguiente acción posible del profesional según estado
var NEXT = { pending:['confirmed','Confirmar'], confirmed:['in_progress','Iniciar'], in_progress:['completed','Completar'] };
var DONE = ['completed','reviewed','cancelled_by_client','cancelled_by_professional','no_show_client','no_show_professional','disputed'];

var ALL = [], FILTER = 'all';

// Clasifica una reserva para el filtro seleccionado
function pasaFiltro(status){
  if (FILTER === 'all') return true;
  if (FILTER === 'done') return DONE.indexOf(status) !== -1;
  return status === FILTER;
}

mountHeader({ search: false });
mountBottomNav('perfil');

// ===== Disponibilidad del profesional =====
var DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var HORAS = []; for (var h=6; h<=22; h++){ HORAS.push((h<10?'0':'')+h+':00'); }
var MI_PRO_ID = null;

function opcionesHora(sel){ return HORAS.map(function(hh){ return '<option value="'+hh+'"'+(hh===sel?' selected':'')+'>'+hh+'</option>'; }).join(''); }

function construirDias(actual){
  // actual: array {weekday, start_time, end_time}. Marca lo que ya existe.
  var byDay = {}; (actual||[]).forEach(function(s){ byDay[s.weekday] = s; });
  var box = document.getElementById('availDays');
  // Orden lun-sáb-dom para que sea natural
  var orden = [1,2,3,4,5,6,0];
  box.innerHTML = orden.map(function(d){
    var s = byDay[d];
    var on = !!s;
    var start = s ? String(s.start_time).slice(0,5) : '08:00';
    var end = s ? String(s.end_time).slice(0,5) : '20:00';
    return '<div class="avail-day">' +
      '<label class="dchk"><input type="checkbox" data-day="'+d+'"'+(on?' checked':'')+' aria-label="Atiendo '+DIAS[d]+'"> '+DIAS[d]+'</label>' +
      '<select data-start="'+d+'" aria-label="Hora inicio '+DIAS[d]+'">'+opcionesHora(start)+'</select>' +
      '<span class="to">a</span>' +
      '<select data-end="'+d+'" aria-label="Hora fin '+DIAS[d]+'">'+opcionesHora(end)+'</select>' +
    '</div>';
  }).join('');
}

async function cargarDisponibilidad(){
  var mp = await misProfesionales();
  if (mp.error || !mp.data.length){ document.getElementById('availSection').style.display='none'; return; }
  MI_PRO_ID = mp.data[0].id;
  var disp = await disponibilidadProfesional(MI_PRO_ID);
  var slots = disp.data || [];
  construirDias(slots);
  document.getElementById('availSummary').textContent = slots.length ? '· ' + slots.length + ' día(s) activos' : '· sin horario';
  document.getElementById('availSection').style.display = 'block';

  document.getElementById('availSave').onclick = async function(){
    var btn = this; btn.disabled = true; btn.textContent = 'Guardando...';
    var slots = [];
    var ok = true;
    document.querySelectorAll('#availDays .avail-day').forEach(function(row){
      var chk = row.querySelector('input[type=checkbox]');
      if (!chk.checked) return;
      var d = parseInt(chk.getAttribute('data-day'));
      var st = row.querySelector('[data-start="'+d+'"]').value;
      var en = row.querySelector('[data-end="'+d+'"]').value;
      if (en <= st) ok = false;
      slots.push({ weekday:d, start_time:st, end_time:en });
    });
    if (!ok){ toast('La hora de fin debe ser mayor que la de inicio.', 'error'); btn.disabled=false; btn.textContent='Guardar disponibilidad'; return; }
    var res = await guardarDisponibilidad(MI_PRO_ID, slots);
    btn.disabled = false; btn.textContent = 'Guardar disponibilidad';
    if (res.error){ toast('No pudimos guardar. Intenta de nuevo.', 'error'); return; }
    toast('Disponibilidad actualizada.', 'success');
    document.getElementById('availSummary').textContent = slots.length ? '· ' + slots.length + ' día(s) activos' : '· sin horario';
  };
}
cargarDisponibilidad();

// Filtros por estado
document.querySelectorAll('.pp-fbtn').forEach(function(btn){
  btn.onclick = function(){
    document.querySelectorAll('.pp-fbtn').forEach(function(x){ x.classList.remove('active'); x.setAttribute('aria-selected','false'); });
    btn.classList.add('active'); btn.setAttribute('aria-selected','true');
    FILTER = btn.getAttribute('data-f');
    render();
  };
});

function resumen(){
  var p=0,c=0,d=0;
  ALL.forEach(function(b){
    if (b.status==='pending') p++;
    else if (b.status==='confirmed') c++;
    else if (b.status==='completed'||b.status==='reviewed') d++;
  });
  document.getElementById('stPending').textContent = p;
  document.getElementById('stConfirmed').textContent = c;
  document.getElementById('stDone').textContent = d;
}

function render(){
  var list = document.getElementById('ppList');
  var data = ALL.filter(function(b){ return pasaFiltro(b.status); });
  if (!data.length){
    list.innerHTML = emptyState({ icon:'📭', title:'Nada en esta vista', text:'No hay reservas con ese estado.', ctaText:'Ver todas', ctaHref:'#' });
    var cta = list.querySelector('a.btn'); if (cta) cta.onclick = function(e){ e.preventDefault(); document.querySelector('.pp-fbtn[data-f="all"]').click(); };
    return;
  }
  list.innerHTML = data.map(function(b){
    var st = STATUS_MAP[b.status] || ['st-pending','Pendiente'];
    var next = NEXT[b.status];
    var actions = '';
    if (next) actions += '<button class="btn btn-primary" data-next="' + b.id + '" data-to="' + next[0] + '">' + next[1] + '</button>';
    if (b.status === 'pending' || b.status === 'confirmed') actions += '<button class="btn btn-ghost" data-cancel="' + b.id + '">Rechazar</button>';
    var svc = b.professionals ? b.professionals.service_name : 'Servicio';
    return '<div class="pp-card"><div class="pp-info">' +
      '<h3>' + esc(svc) + '</h3>' +
      '<p>📅 ' + esc(b.service_date) + ' a las ' + esc(b.service_time) + ' · 📍 ' + esc(b.address) + ' · $' + esc(b.price) + ' MXN</p>' +
      '</div><div class="pp-actions">' + actions + '<span class="pp-status ' + st[0] + '">' + st[1] + '</span></div></div>';
  }).join('');
  list.querySelectorAll('[data-next]').forEach(function(btn){
    btn.onclick = function(){ transicion(btn.getAttribute('data-next'), btn.getAttribute('data-to')); };
  });
  list.querySelectorAll('[data-cancel]').forEach(function(btn){
    btn.onclick = function(){ transicion(btn.getAttribute('data-cancel'), 'cancelled_by_professional'); };
  });
}

async function load() {
  var user = await usuarioActual();
  if (!user) { window.location.href = 'login.html?next=' + encodeURIComponent('pro-panel.html'); return; }

  var list = document.getElementById('ppList');
  list.innerHTML = '<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>';

  var res = await reservasDelProfesional();
  if (res.error) {
    list.innerHTML = '<div class="state-error" role="alert">⚠️ No pudimos cargar las reservas. <button class="btn btn-ghost" onclick="load()">Reintentar</button></div>';
    return;
  }
  ALL = res.data || [];
  if (!ALL.length) {
    document.getElementById('ppSummary').style.display = 'none';
    document.getElementById('ppFilters').style.display = 'none';
    list.innerHTML = emptyState({ icon:'📥', title:'Aún no tienes reservas', text:'Cuando un cliente te reserve, aparecerá aquí. Asegúrate de tener tu perfil activo.', ctaText:'Ofrecer servicios', ctaHref:'ser-profesional.html' });
    return;
  }
  document.getElementById('ppSummary').style.display = 'grid';
  document.getElementById('ppFilters').style.display = 'flex';
  resumen();
  render();
}

async function transicion(id, to) {
  var res = await transicionReserva(id, to);
  if (res.error) { toast(res.error.message, 'error'); return; }
  toast('Reserva actualizada.', 'success');
  load();
}

load();
</script>
</body>
</html>
